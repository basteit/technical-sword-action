<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d14">
  <title>タイトル画面の調整確認｜ケラウノス</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080d14; color: #edf4fb; line-height: 1.8; }
    main { width: min(1040px, 100% - 32px); margin: 24px auto 48px; }
    a { color: #95dcf9; text-underline-offset: .25em; }
    a:focus-visible, button:focus-visible { outline: 2px solid #95dcf9; outline-offset: 5px; }
    h1 { font-size: clamp(1.35rem, 4.5vw, 2rem); margin: 22px 0 8px; line-height: 1.5; }
    p { margin: 0 0 20px; color: #b8c8d7; }
    figure { margin: 0; }
    video, img { display: block; width: 100%; height: auto; background: #000; border: 1px solid #293441; }
    video { aspect-ratio: 16 / 9; }
    figcaption { padding: 8px 0; color: #b8c8d7; font-size: .875rem; }
    .actions { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin: 12px 0 24px; }
    button { min-height: 44px; padding: 9px 20px; border: 1px solid #64869d; border-radius: 5px; background: #172a3b; color: #edf4fb; font: inherit; cursor: pointer; }
    h2 { font-size: 1.1rem; margin: 30px 0 14px; }
    ul { padding-left: 1.4em; color: #b8c8d7; }
    .stills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    @media (max-width: 680px) { .stills { grid-template-columns: 1fr; } main { margin-top: 18px; } }
  </style>
</head>
<body>
  <main>
    <a href="../">← 配布ページへ</a>
    <h1>タイトル画面の調整確認</h1>
    <p>部屋を薄暗くし、ロゴは一度光った後に微弱な発光へ戻します。Unityの通常Game画面を直接撮影しています。</p>
    <figure>
      <video id="preview" controls playsinline muted preload="metadata" poster="../assets/title-preview/title-settled-dim-v4.png" aria-label="部屋を暗くし、ロゴの発光を抑えたタイトル。Unity Game画面の録画">
        <source src="../assets/title-preview/title-reveal-dim-v4.mp4" type="video/mp4">
        <a href="../assets/title-preview/title-reveal-dim-v4.mp4">動画を開く</a>
      </video>
      <figcaption>12秒・無音 ／ 実際のゲーム画面を撮影。スマホでは横向きでも確認できます。</figcaption>
    </figure>
    <div class="actions">
      <button id="replay" type="button">最初から再生</button>
      <a href="../assets/title-preview/title-reveal-dim-v4.mp4">動画を直接開く</a>
      <a href="../assets/title-preview/title-highlight-dim-v4.png">表示直後の画像</a>
    </div>
    <ul>
      <li>ロゴは登場直後に一度だけ光り、約2秒で微弱な発光に落ち着きます。</li>
      <li>部屋全体と青白い反射を暗くし、薄暗いモニタールームの雰囲気を出しています。</li>
      <li>右上だけが光る座標のずれを直し、通常表示・接近時の両方を確認しています。</li>
    </ul>
    <h2>登場直後と通常時</h2>
    <div class="stills">
      <figure>
        <img src="../assets/title-preview/title-highlight-dim-v4.png" alt="ロゴ登場直後。薄暗い部屋の中で一度だけ発光する" width="1280" height="720" loading="lazy">
        <figcaption>登場直後</figcaption>
      </figure>
      <figure>
        <img src="../assets/title-preview/title-settled-dim-v4.png" alt="通常時。ロゴの発光は微弱で、部屋全体は暗い" width="1280" height="720" loading="lazy">
        <figcaption>通常時：微弱な発光のみ</figcaption>
      </figure>
    </div>
  </main>
  <script>
    const video = document.getElementById('preview');
    document.getElementById('replay').addEventListener('click', () => {
      video.currentTime = 0;
      video.play().catch(() => video.focus());
    });
  </script>
</body>
</html>
